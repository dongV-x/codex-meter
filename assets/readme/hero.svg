<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Codex Meter — 剩余额度，一眼看清</title>
  <desc id="desc">Codex Meter 标题和周额度圆环示意。示意值为 48%，并非当前账号读数。</desc>
  <rect width="1200" height="400" rx="24" fill="#141616"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g id="product-title" transform="translate(60 0)">
      <text y="76" font-size="21" font-weight="600" letter-spacing="3" fill="#a1aaa5">CODEX · macOS</text>
      <text y="171" font-size="76" font-weight="700" letter-spacing="-3" fill="#f2f5f3">Codex Meter</text>
      <text y="247" font-size="43" font-weight="600" fill="#f2f5f3">剩余额度，一眼看清。</text>
      <text y="316" font-size="23" fill="#a1aaa5">留在侧栏，专注手头的工作。</text>
    </g>
    <g id="quota-specimen">
      <rect x="834" y="45" width="290" height="310" rx="26" fill="#1d2421"/>
      <circle cx="979" cy="177" r="86" fill="none" stroke="#34473e" stroke-width="13"/>
      <circle cx="979" cy="177" r="86" fill="none" stroke="#39c88d" stroke-width="13" stroke-dasharray="259.37 540.35" stroke-linecap="round" transform="rotate(-90 979 177)"/>
      <text x="979" y="198" text-anchor="middle" font-size="66" font-weight="650" letter-spacing="-3" fill="#f2f5f3">48%</text>
      <text x="979" y="305" text-anchor="middle" font-size="26" fill="#a1aaa5">周额度 · 剩余</text>
    </g>
  </g>
</svg>
